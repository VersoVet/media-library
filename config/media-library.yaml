# media-library - Configuration principale
# Forge Phase 24 - Aucune URL/constante hardcodée dans le code

storage:
  default_backend: nas
  backends:
    nas:
      enabled: true
      mount_path: /mnt/media-library
      base_dir: ""
    dropbox:
      enabled: false
      base_path: /media-library

database:
  type: mariadb
  host: 10.0.0.44
  port: 3306
  name: digikam
  user: digikam
  password_vault_key: digikam_db_password
  pool_size: 5

thumbnails:
  path: /opt/onyx/data/media-library/thumbnails
  size: 320
  format: webp
  quality: 80

endpoints:
  vault: http://10.0.0.44:8050
  paper_reader: http://10.0.0.21:8462
  llm_router: http://localhost:8055

settings:
  groq_model: meta-llama/llama-4-scout-17b-16e-instruct
  max_upload_size_mb: 100
  album_root_label: media-library
  album_root_identifier: "volumeid:?path=/mnt/media-library"
  album_root_specific_path: /
  service_host: 10.0.0.21
  service_port: 8202
